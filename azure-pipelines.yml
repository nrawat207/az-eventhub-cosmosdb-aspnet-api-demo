trigger:
  - main

pr:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  DOTNET_VERSION: '10.0.x'
  REGISTRY_LOGIN_SERVER: '$(ACR_NAME_DEV).azurecr.io'
  ACR_DOCKER_REGISTRY_SERVICE_CONNECTION: 'ACRServiceConnection'
  IMAGE_TAG: '$(Build.SourceVersion)'
  IMAGE_TAG_DEV: 'dev'
  IMAGE_TAG_LATEST: 'dev-latest'
  buildConfiguration: 'Release'

# Required pipeline/library variables:
# - AZURE_SUBSCRIPTION_ID
# - AZURE_RESOURCE_GROUP_DEV
# - ACR_NAME_DEV
# - ACA_BATCH_APP_NAME
# - ACA_RECEIVER_APP_NAME
# - AZURE_DEVOPS_SERVICE_CONNECTION
# - ACR_DOCKER_REGISTRY_SERVICE_CONNECTION, optional override for the default above

stages:
  - stage: Build_And_Test
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build Solution & Run Tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET $(DOTNET_VERSION)'
            inputs:
              version: '$(DOTNET_VERSION)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '**/*.sln'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution'
            inputs:
              command: 'build'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore -p:TreatWarningsAsErrors=true'

          - task: DotNetCoreCLI@2
            displayName: 'Run unit tests with coverage'
            inputs:
              command: 'test'
              projects: 'tests/**/*.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory $(Agent.TempDirectory)/TestResults -- RunConfiguration.DisableAppDomain=true'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish code coverage'
            condition: always()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

  - stage: Lint_Bicep
    displayName: 'Lint Bicep & Validate'
    dependsOn: []
    jobs:
      - job: LintBicep
        displayName: 'Validate Bicep files'
        steps:
          - task: AzureCLI@2
            displayName: 'Build Bicep template'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az bicep build --file infra/main.bicep
                echo "All Bicep files compiled successfully"

          - task: AzureCLI@2
            displayName: 'Run Bicep what-if deployment check'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                az deployment group what-if \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --template-file infra/main.bicep \
                  --parameters infra/parameters/dev.bicepparam \
                  --no-pretty-print
                echo "What-if deployment validation completed"

  - stage: Build_And_Push_Images
    displayName: 'Build & Push Docker Images'
    dependsOn: Build_And_Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImages
        displayName: 'Build and push Docker images'
        steps:
          - task: Docker@2
            displayName: 'Build and push BatchProcessor.Api'
            inputs:
              command: 'buildAndPush'
              Dockerfile: 'src/BatchProcessor.Api/Dockerfile'
              repository: 'batchprocessor-api'
              tags: |
                $(IMAGE_TAG)
                $(IMAGE_TAG_DEV)
                $(IMAGE_TAG_LATEST)
              containerRegistry: '$(ACR_DOCKER_REGISTRY_SERVICE_CONNECTION)'
              addPipelineData: true

          - task: Docker@2
            displayName: 'Build and push ProgressReceiver.Api'
            inputs:
              command: 'buildAndPush'
              Dockerfile: 'src/ProgressReceiver.Api/Dockerfile'
              repository: 'progressreceiver-api'
              tags: |
                $(IMAGE_TAG)
                $(IMAGE_TAG_DEV)
                $(IMAGE_TAG_LATEST)
              containerRegistry: '$(ACR_DOCKER_REGISTRY_SERVICE_CONNECTION)'
              addPipelineData: true

          - script: |
              echo "Images built and pushed:"
              echo "  - $(REGISTRY_LOGIN_SERVER)/batchprocessor-api:$(IMAGE_TAG)"
              echo "  - $(REGISTRY_LOGIN_SERVER)/batchprocessor-api:$(IMAGE_TAG_DEV)"
              echo "  - $(REGISTRY_LOGIN_SERVER)/progressreceiver-api:$(IMAGE_TAG)"
              echo "  - $(REGISTRY_LOGIN_SERVER)/progressreceiver-api:$(IMAGE_TAG_DEV)"
            displayName: 'Log image details'

  - stage: Deploy_Infrastructure
    displayName: 'Deploy Infrastructure'
    dependsOn:
      - Build_And_Test
      - Lint_Bicep
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployInfra
        displayName: 'Deploy Bicep infrastructure'
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy Bicep infrastructure'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                az deployment group create \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --template-file infra/main.bicep \
                  --parameters infra/parameters/dev.bicepparam \
                  --name "bicep-deployment-$(Build.BuildId)"

                echo "Infrastructure deployed successfully"
                az resource list \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --query "[].{Name:name, Type:type}" \
                  --output table

  - stage: Deploy_Apps
    displayName: 'Deploy to Container Apps'
    dependsOn:
      - Deploy_Infrastructure
      - Build_And_Push_Images
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployApps
        displayName: 'Update ACA revisions'
        steps:
          - task: AzureCLI@2
            displayName: 'Update BatchProcessor.Api image'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                az containerapp update \
                  --name "$(ACA_BATCH_APP_NAME)" \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --image "$(REGISTRY_LOGIN_SERVER)/batchprocessor-api:$(IMAGE_TAG)"

          - task: AzureCLI@2
            displayName: 'Update ProgressReceiver.Api image'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                az containerapp update \
                  --name "$(ACA_RECEIVER_APP_NAME)" \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --image "$(REGISTRY_LOGIN_SERVER)/progressreceiver-api:$(IMAGE_TAG)"

          - task: AzureCLI@2
            displayName: 'Wait for BatchProcessor.Api to be healthy'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                max_attempts=30
                attempt=0

                while [ "$attempt" -lt "$max_attempts" ]; do
                  status=$(az containerapp show \
                    --name "$(ACA_BATCH_APP_NAME)" \
                    --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                    --query "properties.provisioningState" \
                    --output tsv 2>/dev/null || echo "Unknown")

                  if [ "$status" = "Succeeded" ]; then
                    echo "BatchProcessor.Api is healthy"
                    exit 0
                  fi

                  attempt=$((attempt + 1))
                  echo "Status: $status (attempt $attempt/$max_attempts), waiting..."
                  sleep 10
                done

                echo "BatchProcessor.Api did not reach a healthy state within timeout"
                exit 1

          - task: AzureCLI@2
            displayName: 'Wait for ProgressReceiver.Api to be healthy'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                max_attempts=30
                attempt=0

                while [ "$attempt" -lt "$max_attempts" ]; do
                  status=$(az containerapp show \
                    --name "$(ACA_RECEIVER_APP_NAME)" \
                    --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                    --query "properties.provisioningState" \
                    --output tsv 2>/dev/null || echo "Unknown")

                  if [ "$status" = "Succeeded" ]; then
                    echo "ProgressReceiver.Api is healthy"
                    exit 0
                  fi

                  attempt=$((attempt + 1))
                  echo "Status: $status (attempt $attempt/$max_attempts), waiting..."
                  sleep 10
                done

                echo "ProgressReceiver.Api did not reach a healthy state within timeout"
                exit 1

          - script: |
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              {
                echo "## Deployment Summary"
                echo ""
                echo "**Environment:** Dev"
                echo "**Build:** $(Build.BuildNumber)"
                echo "**Commit:** $(Build.SourceVersion)"
                echo ""
                echo "### Deployed Components"
                echo "- Infrastructure (Bicep)"
                echo "- BatchProcessor.Api (Image: $(IMAGE_TAG))"
                echo "- ProgressReceiver.Api (Image: $(IMAGE_TAG))"
                echo ""
                echo "### Resources"
                echo "- Resource Group: \`$(AZURE_RESOURCE_GROUP_DEV)\`"
                echo "- Registry: \`$(REGISTRY_LOGIN_SERVER)\`"
              } > "$(Build.ArtifactStagingDirectory)/deployment-summary.md"
            displayName: 'Create deployment summary'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish deployment summary'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'deployment-summary'
