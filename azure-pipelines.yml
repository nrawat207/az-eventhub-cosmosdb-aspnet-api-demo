# ==============================================================================
# Azure DevOps Pipeline: EventHub & CosmosDB Learning Demo CI/CD
# ==============================================================================
# 
# SETUP REQUIREMENTS:
# 1. Create Service Connection: Project Settings → Service connections → 
#    Azure Resource Manager (Workload Identity recommended)
#    Name: $(AZURE_DEVOPS_SERVICE_CONNECTION)
#
# 2. Create Variable Group: Pipelines → Library → Variable groups
#    Name: dev-pipeline-vars
#    Variables:
#      - AZURE_SUBSCRIPTION_ID: <Your-Subscription-ID>
#      - AZURE_RESOURCE_GROUP_DEV: <Your-Resource-Group>
#      - ACR_NAME_DEV: <Your-ACR-Name> (no hyphens)
#      - ACA_BATCH_APP_NAME: batch-processor-api
#      - ACA_RECEIVER_APP_NAME: progress-receiver-api
#      - AZURE_DEVOPS_SERVICE_CONNECTION: <Service-Connection-Name>
#      - ACR_DOCKER_REGISTRY_SERVICE_CONNECTION: ACRServiceConnection
#
# 3. Create Docker Registry Service Connection for ACR (optional)
#
# TRIGGERS:
# - Push to main: Full pipeline (Build → Lint → Build Images → Deploy Infra → Deploy Apps)
# - Pull Request to main: CI only (Build & Test, Lint Bicep)
# - Manual: Full pipeline on-demand
# ==============================================================================

trigger:
  - main

pr:
  - main

pool:
  vmImage: 'ubuntu-latest'
  name: 'Azure Pipelines'

variables:
  - group: dev-pipeline-vars  # <-- This pulls in all variables from your Azure DevOps variable group
  - name: DOTNET_VERSION
    value: '10.0.x'
  - name: REGISTRY_LOGIN_SERVER
    value: '$(ACR_NAME_DEV).azurecr.io'
  - name: IMAGE_TAG
    value: '$(Build.SourceVersion)'
  - name: IMAGE_TAG_DEV
    value: 'dev'
  - name: IMAGE_TAG_LATEST
    value: 'dev-latest'
  - name: buildConfiguration
    value: 'Release'
  - name: ARTIFACT_STAGING
    value: '$(Build.ArtifactStagingDirectory)'

stages:
  - stage: Build_And_Test
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build Solution & Run Tests'
        #timeoutInMinutes: 30
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET $(DOTNET_VERSION)'
            inputs:
              version: '$(DOTNET_VERSION)'
              packageType: 'sdk'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '**/*.sln'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution'
            inputs:
              command: 'build'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore -p:TreatWarningsAsErrors=true'

          - task: DotNetCoreCLI@2
            displayName: 'Run unit tests with coverage'
            inputs:
              command: 'test'
              projects: 'tests/**/*.csproj'
              # 1. Removed --logger and --results-directory from here
              arguments: '--configuration $(buildConfiguration) --no-build --collect:"XPlat Code Coverage"'
              # 2. Let Azure DevOps natively handle and publish the TRX files
              publishTestResults: true

          # - task: PublishTestResults@2
          #   displayName: 'Publish test results'
          #   condition: always()
          #   inputs:
          #     testResultsFormat: 'VSTest'
          #     testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
          #     mergeTestResults: true
          #     failTaskOnFailedTests: true
          #     publishRunAttachments: true

          # - task: PublishCodeCoverageResults@1
          #   displayName: 'Publish code coverage'
          #   condition: always()
          #   inputs:
          #     codeCoverageTool: 'Cobertura'
          #     summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'
          #     reportDirectory: '$(Agent.TempDirectory)/TestResults'
          #     failIfCoverageEmpty: false

  - stage: Lint_Bicep
    displayName: 'Lint Bicep & Validate'
    dependsOn: []
    jobs:
      - job: LintBicep
        displayName: 'Validate Bicep files'
       # timeoutInMinutes: 15
        steps:
          - task: AzureCLI@2
            displayName: 'Build Bicep template'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]Bicep Build"
                az bicep build --file infra/main.bicep
                echo "✓ All Bicep files compiled successfully"
                echo "##[endgroup]"

          - task: AzureCLI@2
            displayName: 'Validate Bicep parameters'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]Parameter Validation"
                # Validate that parameters file exists and is valid
                if [ -f infra/parameters/dev.bicepparam ]; then
                  echo "✓ Parameters file found: infra/parameters/dev.bicepparam"
                else
                  echo "✗ Parameters file not found: infra/parameters/dev.bicepparam"
                  exit 1
                fi
                echo "##[endgroup]"

          - task: AzureCLI@2
            displayName: 'Run Bicep what-if deployment check'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]What-If Validation"
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                az deployment group what-if \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --template-file infra/main.bicep \
                  --parameters infra/parameters/dev.bicepparam \
                  --no-pretty-print 2>&1 | head -100
                echo "✓ What-if deployment validation completed"
                echo "##[endgroup]"

  - stage: Build_And_Push_Images
    displayName: 'Build & Push Docker Images'
    dependsOn: Build_And_Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImages
        displayName: 'Build and push Docker images'
        #timeoutInMinutes: 20
        steps:
          - task: Docker@2
            displayName: 'Build and push BatchProcessor.Api'
            inputs:
              command: 'buildAndPush'
              Dockerfile: 'src/BatchProcessor.Api/Dockerfile'
              # REMOVED the $(REGISTRY_LOGIN_SERVER)/ prefix here:
              repository: 'batchprocessor-api'
              tags: |
                $(IMAGE_TAG)
                $(IMAGE_TAG_DEV)
                $(IMAGE_TAG_LATEST)
              containerRegistry: '$(ACR_DOCKER_REGISTRY_SERVICE_CONNECTION)'
              buildContext: '$(Build.Repository.LocalPath)'
              addPipelineData: true 

          - task: Docker@2
            displayName: 'Build and push ProgressReceiver.Api'
            inputs:
              command: 'buildAndPush'
              Dockerfile: 'src/ProgressReceiver.Api/Dockerfile'
              # REMOVED the $(REGISTRY_LOGIN_SERVER)/ prefix here:
              repository: 'progressreceiver-api'
              tags: |
                $(IMAGE_TAG)
                $(IMAGE_TAG_DEV)
                $(IMAGE_TAG_LATEST)
              containerRegistry: '$(ACR_DOCKER_REGISTRY_SERVICE_CONNECTION)'
              buildContext: '$(Build.Repository.LocalPath)'
              addPipelineData: true

          - script: |
              echo "##[section]Images built and pushed successfully"
              echo "BatchProcessor.Api:"
              echo "  - $(REGISTRY_LOGIN_SERVER)/batchprocessor-api:$(IMAGE_TAG)"
              echo "  - $(REGISTRY_LOGIN_SERVER)/batchprocessor-api:$(IMAGE_TAG_DEV)"
              echo "  - $(REGISTRY_LOGIN_SERVER)/batchprocessor-api:$(IMAGE_TAG_LATEST)"
              echo ""
              echo "ProgressReceiver.Api:"
              echo "  - $(REGISTRY_LOGIN_SERVER)/progressreceiver-api:$(IMAGE_TAG)"
              echo "  - $(REGISTRY_LOGIN_SERVER)/progressreceiver-api:$(IMAGE_TAG_DEV)"
              echo "  - $(REGISTRY_LOGIN_SERVER)/progressreceiver-api:$(IMAGE_TAG_LATEST)"
            displayName: 'Log image details'

  - stage: Deploy_Infrastructure
    displayName: 'Deploy Infrastructure'
    dependsOn:
      - Build_And_Test
      - Lint_Bicep
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployInfra
        displayName: 'Deploy Bicep infrastructure'
       # timeoutInMinutes: 30
        steps:
          - task: AzureCLI@2
            displayName: 'Deploy Bicep infrastructure'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]Infrastructure Deployment"
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                echo "Deploying to Resource Group: $(AZURE_RESOURCE_GROUP_DEV)"
                
                az deployment group create \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --template-file infra/main.bicep \
                  --parameters infra/parameters/dev.bicepparam \
                  --name "bicep-deployment-$(Build.BuildId)"

                echo "✓ Infrastructure deployed successfully"
                echo "##[endgroup]"

          - task: AzureCLI@2
            displayName: 'List deployed resources'
            condition: always()
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]Deployed Resources"
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                az resource list \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --query "[].{Name:name, Type:type, State:provisioningState}" \
                  --output table
                echo "##[endgroup]"

  - stage: Deploy_Apps
    displayName: 'Deploy to Container Apps'
    dependsOn:
      - Deploy_Infrastructure
      - Build_And_Push_Images
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployApps
        displayName: 'Update ACA revisions'
       # timeoutInMinutes: 25
        steps:
          - task: AzureCLI@2
            displayName: 'Update BatchProcessor.Api image'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]Updating BatchProcessor.Api"
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                az containerapp update \
                  --name "$(ACA_BATCH_APP_NAME)" \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --image "$(REGISTRY_LOGIN_SERVER)/batchprocessor-api:$(IMAGE_TAG)"
                echo "✓ BatchProcessor.Api image updated to $(IMAGE_TAG)"
                echo "##[endgroup]"

          - task: AzureCLI@2
            displayName: 'Update ProgressReceiver.Api image'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]Updating ProgressReceiver.Api"
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                az containerapp update \
                  --name "$(ACA_RECEIVER_APP_NAME)" \
                  --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                  --image "$(REGISTRY_LOGIN_SERVER)/progressreceiver-api:$(IMAGE_TAG)"
                echo "✓ ProgressReceiver.Api image updated to $(IMAGE_TAG)"
                echo "##[endgroup]"

          - task: AzureCLI@2
            displayName: 'Wait for BatchProcessor.Api to be healthy'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]Waiting for BatchProcessor.Api to be ready"
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                max_attempts=30
                attempt=0

                while [ "$attempt" -lt "$max_attempts" ]; do
                  status=$(az containerapp show \
                    --name "$(ACA_BATCH_APP_NAME)" \
                    --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                    --query "properties.provisioningState" \
                    --output tsv 2>/dev/null || echo "Unknown")

                  if [ "$status" = "Succeeded" ]; then
                    echo "✓ BatchProcessor.Api is healthy (status: $status)"
                    echo "##[endgroup]"
                    exit 0
                  fi

                  attempt=$((attempt + 1))
                  echo "⏳ Status: $status (attempt $attempt/$max_attempts), waiting..."
                  sleep 10
                done

                echo "✗ BatchProcessor.Api did not reach a healthy state within timeout (30 min)"
                echo "##[endgroup]"
                exit 1

          - task: AzureCLI@2
            displayName: 'Wait for ProgressReceiver.Api to be healthy'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                echo "##[group]Waiting for ProgressReceiver.Api to be ready"
                az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                max_attempts=30
                attempt=0

                while [ "$attempt" -lt "$max_attempts" ]; do
                  status=$(az containerapp show \
                    --name "$(ACA_RECEIVER_APP_NAME)" \
                    --resource-group "$(AZURE_RESOURCE_GROUP_DEV)" \
                    --query "properties.provisioningState" \
                    --output tsv 2>/dev/null || echo "Unknown")

                  if [ "$status" = "Succeeded" ]; then
                    echo "✓ ProgressReceiver.Api is healthy (status: $status)"
                    echo "##[endgroup]"
                    exit 0
                  fi

                  attempt=$((attempt + 1))
                  echo "⏳ Status: $status (attempt $attempt/$max_attempts), waiting..."
                  sleep 10
                done

                echo "✗ ProgressReceiver.Api did not reach a healthy state within timeout (30 min)"
                echo "##[endgroup]"
                exit 1

          - script: |
              mkdir -p "$(ARTIFACT_STAGING)"
              {
                echo "## Deployment Summary"
                echo ""
                echo "**Pipeline:** Azure DevOps Pipelines"
                echo "**Environment:** Dev"
                echo "**Build Number:** $(Build.BuildNumber)"
                echo "**Build ID:** $(Build.BuildId)"
                echo "**Commit:** $(Build.SourceVersion)"
                echo "**Branch:** $(Build.SourceBranch)"
                echo ""
                echo "### Deployment Status"
                echo "✓ Infrastructure deployed (Bicep)"
                echo "✓ Docker images built and pushed to ACR"
                echo "✓ BatchProcessor.Api deployed"
                echo "✓ ProgressReceiver.Api deployed"
                echo ""
                echo "### Deployed Components"
                echo "- **BatchProcessor.Api**"
                echo "  - Image: \`$(REGISTRY_LOGIN_SERVER)/batchprocessor-api:$(IMAGE_TAG)\`"
                echo "  - App: \`$(ACA_BATCH_APP_NAME)\`"
                echo "- **ProgressReceiver.Api**"
                echo "  - Image: \`$(REGISTRY_LOGIN_SERVER)/progressreceiver-api:$(IMAGE_TAG)\`"
                echo "  - App: \`$(ACA_RECEIVER_APP_NAME)\`"
                echo ""
                echo "### Resources"
                echo "- **Subscription ID:** \`$(AZURE_SUBSCRIPTION_ID)\`"
                echo "- **Resource Group:** \`$(AZURE_RESOURCE_GROUP_DEV)\`"
                echo "- **ACR:** \`$(REGISTRY_LOGIN_SERVER)\`"
              } > "$(ARTIFACT_STAGING)/deployment-summary.md"
            displayName: 'Generate deployment summary'
            condition: succeeded()

          - task: PublishBuildArtifacts@1
            displayName: 'Publish deployment artifacts'
            condition: always()
            inputs:
              PathtoPublish: '$(ARTIFACT_STAGING)'
              ArtifactName: 'deployment-summary'
              publishLocation: 'Container'
