# This ensures humans review deployments to critical environments before execution.

# Service connections required (configure in Azure DevOps):
# - AzureResourceManagerConnection: Service Principal with Contributor access
# - acrConnection: Container Registry connection (for Docker@2 task)

# Environment variables required:
# - acrName: Name of Azure Container Registry (e.g., azlearnacrdev)
# - acrLoginServer: Login server of ACR (e.g., azlearnacrdev.azurecr.io)
