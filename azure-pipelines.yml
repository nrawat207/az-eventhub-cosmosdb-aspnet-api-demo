# 2. Add Approvals & Checks:
#    - Click on environment > Approvals and checks
#    - Add "Approval": select users/groups who must approve
#    - Add "Conditional": specify conditions (branch, etc.)
#    - Add "Business hours": restrict deployments to business hours (optional)
#
# 3. Configure pipeline to use environment:
