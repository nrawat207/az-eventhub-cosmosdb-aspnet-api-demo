trigger:
  - main

pr:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  DOTNET_VERSION: '10.0.x'
  REGISTRY_LOGIN_SERVER: '$(ACR_NAME_DEV).azurecr.io'
  IMAGE_TAG: '$(Build.SourceVersion)'
  IMAGE_TAG_LATEST: 'dev-latest'
  buildConfiguration: 'Release'

# ============================================================================
# REQUIRED VARIABLES (set in Azure DevOps Pipeline Settings)
# ============================================================================
# Pipeline Variables (Project Settings > Pipelines > Library):
#   - AZURE_CLIENT_ID: Service Principal Client ID
#   - AZURE_TENANT_ID: Azure AD Tenant ID
#   - AZURE_SUBSCRIPTION_ID: Target subscription
#   - AZURE_RESOURCE_GROUP_DEV: Dev resource group name
#   - ACR_NAME_DEV: Container Registry name
#   - ACA_BATCH_APP_NAME: Batch Processor app name
#   - ACA_RECEIVER_APP_NAME: Progress Receiver app name
#   - AZURE_DEVOPS_SERVICE_CONNECTION: Name of service connection to Azure
#
# Service Connection:
#   - Create a Service Connection to Azure (Project Settings > Service connections)
#   - Use Workload Identity Federation or Managed Identity (no secrets)
#   - Name it "AzureServiceConnection" or reference in steps

stages:
  # ============================================================================
  # STAGE 1: BUILD & TEST (Runs regardless of trigger)
  # ============================================================================
  - stage: Build_And_Test
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Build Solution & Run Tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET $(DOTNET_VERSION)'
            inputs:
              version: $(DOTNET_VERSION)

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution (warnings as errors)'
            inputs:
              command: 'build'
              arguments: '--configuration $(buildConfiguration) --no-restore -p:TreatWarningsAsErrors=true'

          - task: DotNetCoreCLI@2
            displayName: 'Run unit tests with coverage'
            inputs:
              command: 'test'
              arguments: |
                --configuration $(buildConfiguration) \
                --no-build \
                --logger trx \
                --collect:"XPlat Code Coverage" \
                --results-directory $(Agent.TempDirectory)/TestResults \
                -- RunConfiguration.DisableAppDomain=true

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
              mergeTestResults: true
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@1
            displayName: 'Publish code coverage'
            condition: always()
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: '$(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml'

  # ============================================================================
  # STAGE 2: LINT BICEP (Runs in parallel with build-and-test)
  # ============================================================================
  - stage: Lint_Bicep
    displayName: 'Lint Bicep & Validate'
    dependsOn: []
    jobs:
      - job: LintBicep
        displayName: 'Validate Bicep files'
        steps:
          - task: AzureCLI@2
            displayName: 'Build all Bicep modules'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Building all Bicep modules..."
                az bicep build --file infra/main.bicep
                echo "✓ All Bicep files compiled successfully"

          - task: AzureCLI@2
            displayName: 'Run Bicep what-if deployment check'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(AZURE_RESOURCE_GROUP_DEV) \
                  --template-file infra/main.bicep \
                  --parameters infra/parameters/dev.bicepparam \
                  --no-pretty-print || true
                echo "✓ What-if deployment validation completed"

  # ============================================================================
  # STAGE 3: BUILD & PUSH DOCKER IMAGES (only on main branch)
  # ============================================================================
  - stage: Build_And_Push_Images
    displayName: 'Build & Push Docker Images'
    dependsOn: Build_And_Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImages
        displayName: 'Build and push Docker images'
        steps:
          - task: Docker@2
            displayName: 'Build and push BatchProcessor.Api'
            inputs:
              command: 'buildAndPush'
              Dockerfile: 'src/BatchProcessor.Api/Dockerfile'
              repository: '$(REGISTRY_LOGIN_SERVER)/batch-processor'
              tags: |
                $(IMAGE_TAG)
                $(IMAGE_TAG_LATEST)
              containerRegistry: '$(ACR_DOCKER_REGISTRY_SERVICE_CONNECTION)'
              addPipelineData: true

          - task: Docker@2
            displayName: 'Build and push ProgressReceiver.Api'
            inputs:
              command: 'buildAndPush'
              Dockerfile: 'src/ProgressReceiver.Api/Dockerfile'
              repository: '$(REGISTRY_LOGIN_SERVER)/progress-receiver'
              tags: |
                $(IMAGE_TAG)
                $(IMAGE_TAG_LATEST)
              containerRegistry: '$(ACR_DOCKER_REGISTRY_SERVICE_CONNECTION)'
              addPipelineData: true

          - script: |
              echo "Images built and pushed:"
              echo "  - $(REGISTRY_LOGIN_SERVER)/batch-processor:$(IMAGE_TAG)"
              echo "  - $(REGISTRY_LOGIN_SERVER)/progress-receiver:$(IMAGE_TAG)"
            displayName: 'Log image details'

  # ============================================================================
  # STAGE 4: DEPLOY INFRASTRUCTURE (only on main branch)
  # ============================================================================
  - stage: Deploy_Infrastructure
    displayName: 'Deploy Infrastructure'
    dependsOn: Lint_Bicep
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployInfra
        displayName: 'Deploy Bicep infrastructure'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            displayName: 'Deploy via ARM/Bicep'
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              subscriptionId: '$(AZURE_SUBSCRIPTION_ID)'
              action: 'Create Or Update Resource Group'
              resourceGroupName: '$(AZURE_RESOURCE_GROUP_DEV)'
              location: 'eastus'
              templateLocation: 'Linked artifact'
              csmFile: 'infra/main.bicep'
              csmParametersFile: 'infra/parameters/dev.bicepparam'
              deploymentMode: 'Incremental'
              deploymentName: 'bicep-deployment-$(Build.BuildId)'
              outputs: 'deploymentOutputs'

          - script: |
              echo "✓ Infrastructure deployed successfully"
              az resource list \
                --resource-group $(AZURE_RESOURCE_GROUP_DEV) \
                --query "[].{Name:name, Type:type}" \
                --output table
            displayName: 'List deployed resources'
            env:
              AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)

  # ============================================================================
  # STAGE 5: DEPLOY CONTAINER APPS (only on main branch)
  # ============================================================================
  - stage: Deploy_Apps
    displayName: 'Deploy to Container Apps'
    dependsOn:
      - Deploy_Infrastructure
      - Build_And_Push_Images
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployApps
        displayName: 'Update ACA revisions'
        steps:
          - task: AzureCLI@2
            displayName: 'Update BatchProcessor.Api image'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Updating BatchProcessor.Api image to $(IMAGE_TAG)..."
                az containerapp update \
                  --name $(ACA_BATCH_APP_NAME) \
                  --resource-group $(AZURE_RESOURCE_GROUP_DEV) \
                  --image $(REGISTRY_LOGIN_SERVER)/batch-processor:$(IMAGE_TAG)

          - task: AzureCLI@2
            displayName: 'Update ProgressReceiver.Api image'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Updating ProgressReceiver.Api image to $(IMAGE_TAG)..."
                az containerapp update \
                  --name $(ACA_RECEIVER_APP_NAME) \
                  --resource-group $(AZURE_RESOURCE_GROUP_DEV) \
                  --image $(REGISTRY_LOGIN_SERVER)/progress-receiver:$(IMAGE_TAG)

          - task: AzureCLI@2
            displayName: 'Wait for BatchProcessor.Api to be healthy'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Waiting for BatchProcessor.Api revision to be healthy..."
                max_attempts=30
                attempt=0
                while [ $attempt -lt $max_attempts ]; do
                  status=$(az containerapp revision show \
                    --name $(ACA_BATCH_APP_NAME) \
                    --resource-group $(AZURE_RESOURCE_GROUP_DEV) \
                    --query "properties.provisioningState" -o tsv 2>/dev/null || echo "Unknown")
                  
                  if [ "$status" == "Succeeded" ]; then
                    echo "✓ BatchProcessor.Api revision is healthy"
                    break
                  fi
                  
                  attempt=$((attempt + 1))
                  if [ $attempt -lt $max_attempts ]; then
                    echo "  Status: $status (attempt $attempt/$max_attempts), waiting..."
                    sleep 10
                  fi
                done
                
                if [ $attempt -eq $max_attempts ]; then
                  echo "⚠ BatchProcessor.Api did not reach healthy state within timeout"
                  exit 1
                fi

          - task: AzureCLI@2
            displayName: 'Wait for ProgressReceiver.Api to be healthy'
            inputs:
              azureSubscription: '$(AZURE_DEVOPS_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Waiting for ProgressReceiver.Api revision to be healthy..."
                max_attempts=30
                attempt=0
                while [ $attempt -lt $max_attempts ]; do
                  status=$(az containerapp revision show \
                    --name $(ACA_RECEIVER_APP_NAME) \
                    --resource-group $(AZURE_RESOURCE_GROUP_DEV) \
                    --query "properties.provisioningState" -o tsv 2>/dev/null || echo "Unknown")
                  
                  if [ "$status" == "Succeeded" ]; then
                    echo "✓ ProgressReceiver.Api revision is healthy"
                    break
                  fi
                  
                  attempt=$((attempt + 1))
                  if [ $attempt -lt $max_attempts ]; then
                    echo "  Status: $status (attempt $attempt/$max_attempts), waiting..."
                    sleep 10
                  fi
                done
                
                if [ $attempt -eq $max_attempts ]; then
                  echo "⚠ ProgressReceiver.Api did not reach healthy state within timeout"
                  exit 1
                fi

          - script: |
              echo "## 🚀 Deployment Summary" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "**Environment:** Dev" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "**Build:** $(Build.BuildNumber)" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "**Commit:** $(Build.SourceVersion)" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "### Deployed Components" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "- ✅ Infrastructure (Bicep)" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "- ✅ BatchProcessor.Api (Image: $(IMAGE_TAG))" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "- ✅ ProgressReceiver.Api (Image: $(IMAGE_TAG))" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "### Resources" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "- Resource Group: \`$(AZURE_RESOURCE_GROUP_DEV)\`" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
              echo "- Registry: \`$(REGISTRY_LOGIN_SERVER)\`" >> $(Build.ArtifactStagingDirectory)/deployment-summary.md
            displayName: 'Create deployment summary'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish deployment summary'
            condition: always()
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'deployment-summary'

