services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: az-eventhub-cosmosdb-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    networks:
      - local-dev

  eventhubs-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    container_name: az-eventhub-cosmosdb-eventhubs
    pull_policy: always
    ports:
      - "5672:5672"
      - "9092:9092"
      - "5300:5300"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
    volumes:
      - ./infra/local/eventhubs-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
      - eventhubs-data:/Eventhubs_Emulator/Data
    depends_on:
      - azurite
    networks:
      local-dev:
        aliases:
          - eventhubs-emulator

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: az-eventhub-cosmosdb-cosmos
    ports:
      - "8081:8081"
      - "10250-10255:10250-10255"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: ${AZURE_COSMOS_EMULATOR_PARTITION_COUNT:-3}
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
      AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE: ${AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE:-127.0.0.1}
    volumes:
      - cosmosdb-data:/tmp/cosmos/appdata
    networks:
      - local-dev

  batchprocessor-api:
    build:
      context: .
      dockerfile: src/BatchProcessor.Api/Dockerfile
    container_name: az-eventhub-cosmosdb-batchprocessor-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AZURE_KEY_VAULT_URI: ""
      APPLICATIONINSIGHTS_CONNECTION_STRING: ""
      EventHub__Name: ${EVENTHUB_NAME:-batch-progress}
      EventHub__ConnectionString: ${EVENTHUB_CONNECTION_STRING_DOCKER:-Endpoint=sb://eventhubs-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
      ConnectionStrings__EventHub: ${EVENTHUB_CONNECTION_STRING_DOCKER:-Endpoint=sb://eventhubs-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
    depends_on:
      - eventhubs-emulator
    networks:
      - local-dev

  progressreceiver-api:
    build:
      context: .
      dockerfile: src/ProgressReceiver.Api/Dockerfile
    container_name: az-eventhub-cosmosdb-progressreceiver-api
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AZURE_KEY_VAULT_URI: ""
      APPLICATIONINSIGHTS_CONNECTION_STRING: ""
      EventHub__Name: ${EVENTHUB_NAME:-batch-progress}
      EventHub__ConnectionString: ${EVENTHUB_CONNECTION_STRING_DOCKER:-Endpoint=sb://eventhubs-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
      ConnectionStrings__EventHub: ${EVENTHUB_CONNECTION_STRING_DOCKER:-Endpoint=sb://eventhubs-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
      CosmosDb__AccountEndpoint: ${COSMOSDB_ENDPOINT_DOCKER:-https://cosmosdb:8081/}
      CosmosDb__AccountKey: ${COSMOSDB_KEY:-C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEAemtxqYjhyFQJxqRQtPzkkmC0lZyV3gRvWz8rC/4YQzJ3lqSNC9s3w==}
      CosmosDb__DatabaseName: ${COSMOSDB_DATABASE:-batch-processing}
      CosmosDb__ContainerName: ${COSMOSDB_CONTAINER:-batch-jobs}
      CosmosDb__CreateDatabaseAndContainer: "true"
      CosmosDb__AllowInvalidServerCertificate: "true"
      Storage__ConnectionString: ${AZURITE_CONNECTION_STRING_DOCKER:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNoWfeYFt3sp+K2R4C8clEwHmDLzwfZ7s9yq8JgiLEtMA==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;}
      Storage__BlobServiceUri: http://azurite:10000/devstoreaccount1
      Storage__CheckpointContainerUri: ""
    depends_on:
      - azurite
      - eventhubs-emulator
      - cosmosdb
    networks:
      - local-dev

networks:
  local-dev:
    driver: bridge

volumes:
  azurite-data:
  cosmosdb-data:
  eventhubs-data:
